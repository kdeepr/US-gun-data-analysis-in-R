name: Render Quarto Report

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.1'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagick++-dev libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install R packages
        run: |
          install.packages(c(
            "readr", "skimr", "gt", "dplyr", "tidyr",
            "ggplot2", "stringr", "scales", "circlize",
            "tidyverse", "flextable", "naniar", "lubridate",
            "ggpubr", "magick", "ggrepel"
          ))
        shell: Rscript {0}
      - name: Render Quarto
        run: quarto render US_gun_data_Analysis.qmd --to html
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
